<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 25px;
        }

        .container {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .menu button {
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .menu button:hover {
            background: #e5e7eb;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏠 Rent Management</h1>
    <p>Property & Rent Management System</p>
</header>

<div class="container">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Properties</h3>
            <p>0</p>
        </div>

        <div class="card">
            <h3>Occupied</h3>
            <p>0</p>
        </div>

        <div class="card">
            <h3>Vacant</h3>
            <p>0</p>
        </div>

        <div class="card">
            <h3>Pending Rent</h3>
            <p>₹0</p>
        </div>

    </div>

    <div class="menu">

        <button>🏢 Properties</button>

        <button>👤 Tenants</button>

        <button>💰 Rent Collection</button>

        <button>📋 Payment History</button>

        <button>📊 Reports</button>

        <button>⚙️ Settings</button>

    </div>

</div>

</body>
</html>
